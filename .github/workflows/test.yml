name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-avora:
    name: Avora Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/avora
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install .
          pip install ".[dev]"

      - name: Run avora tests
        run: python -m pytest tests/ -v

  test-remote-avora:
    name: Remote Avora Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/remote_avora
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install .
          pip install ".[dev]"

      - name: Run remote avora tests
        run: python -m pytest tests/ -v