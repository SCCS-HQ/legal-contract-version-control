site_name: Avora documentation
site_description: Documentation for the Avora project
site_author: Daniel Phillion
site_url: https://avora-docx.github.io/Avora-Docx/
repo_url: https://github.com/Avora-Docx/Avora-Docx/
repo_name: Avora-Docx/Avora-Docx

strict: true

use_directory_urls: true

exclude_docs: drafts/

theme:
  name: material
  language: en

  palette:
    # Light mode
    - scheme: default
      primary: cyan
      accent: light-blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: cyan
      accent: light-blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

not_in_nav: |
  /PR_REVIEWER.md
  /pull_request_template.md

nav:
  - Home: README.md
  - Local Avora:
      - Overview: avora/README.md
      - Installation: avora/installation.md
      - Usage: avora/usage.md
  - Remote Avora:
      - Overview: remote_avora/README.md
      - Installation: remote_avora/installation.md
      - Usage: remote_avora/usage.md
  - Contributing:
      - Code of Conduct: contributing/CODE_OF_CONDUCT.md
      - Contributing Guide: contributing/CONTRIBUTING.md
  - Changelog: changelog.md