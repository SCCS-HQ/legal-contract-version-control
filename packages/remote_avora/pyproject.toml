[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-avora"
version = "0.1.1"
description = "Remote API for Self-Hosting of Avora"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
   "fastapi[standard]"
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Phillion", email = "danielaphillion@gmail.com" }]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio"
]

[project.scripts]
remote-avora = "remote_avora.remote_avora_entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"